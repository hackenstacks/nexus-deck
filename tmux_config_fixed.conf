# ============================================================================
# Tmux Configuration - Fixed and Optimized
# Beautiful, Secure & Optimized - Sane, Simple, Secure
# ============================================================================

# ============================================================================
# SECURITY SETTINGS
# ============================================================================
set -g allow-rename off
set -g buffer-limit 50
set -g history-limit 10000
set -g set-titles off
set -g set-titles-string ""

# ============================================================================
# BASIC SETTINGS
# ============================================================================
set -g utf8 on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g mode-mouse on

# ============================================================================
# KEYBINDINGS - UPDATED TO USE CTRL+Z AND CTRL+SPACE
# ============================================================================
# Set primary prefix to Ctrl+z and secondary prefix to Ctrl+space
set -g prefix C-z
set -g prefix2 C-Space

# Unbind default Ctrl+b prefix
unbind C-b
bind C-z send-prefix
bind C-Space send-prefix

# Navigation keybindings
bind -n M-Left previous-window
bind -n M-Right next-window

bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R

# Additional useful keybindings
bind -n C-z send-prefix
bind -n C-Space send-prefix

# ============================================================================
# STATUS BAR
# ============================================================================
set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-style bg=default,fg=default
set -g status-interval 1

set -g status-left-length 40
set -g status-left-style bg=default,fg=default
set -g status-left "#[fg=cyan,bold]#S#[default] | #[fg=green]#I:#W#[default] | #[fg=yellow]%H:%M#[default] | #[fg=magenta]%d %b %Y#[default]"

set -g status-right-length 100
set -g status-right-style bg=default,fg=default
set -g status-right "#[fg=red]{battery_percentage}%#[default] | #[fg=blue]{cpu_percentage}%#[default] | #[fg=yellow]{ram_percentage}%#[default] | #[fg=green]{network_up}#[default] | #[fg=cyan]{network_down}#[default] | #[fg=magenta]{hostname}#[default]"

set -g window-status-format "#[fg=default,bg=default] #I:#W#[default]"
set -g window-status-current-format "#[fg=black,bg=cyan,bold] #I:#W#[default]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=yellow,bold"

# ============================================================================
# APPEARANCE
# ============================================================================
set -g default-terminal "xterm-256color"
set -g terminal-overrides ",xterm-256color:Tc"
set -g pane-border-style fg=default,bg=default
set -g pane-active-border-style fg=cyan,bg=default

# ============================================================================
# PLUGINS
# ============================================================================
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-open"
set -g @plugin "tmux-plugins/tmux-cpu"

# Plugin configurations
set -g @resurrect-strategy-vim "session"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"
set -g @continuum-boot "on"
set -g @resurrect-capture-pane-contents "off"
set -g @continuum-capture-pane-contents "off"

# ============================================================================
# COPY MODE
# ============================================================================
set -g mode-keys vi
set -g @yank-selection "primary"
set -g @yank-copy-command "xclip -in -selection clipboard"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi r send -X rectangle-toggle

# ============================================================================
# RELOAD
# ============================================================================
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ============================================================================
# TPM INITIALIZATION
# ============================================================================
run-shell ~/.tmux/plugins/tpm/tpm